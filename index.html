<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP Laboratorium Viewer</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        body {
            margin: 0;
            background-color: #334155;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .toolbar {
            background-color: #0f172a;
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #2563eb; }
        
        .canvas-container {
            margin-top: 25px;
            margin-bottom: 25px;
            overflow: auto;
            display: flex;
            justify-content: center;
            width: 100%;
        }
        canvas {
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 95%;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn" id="prev-page">⬅ Sebelumnya</button>
        <span style="font-size: 1.1rem;">Halaman: <strong id="page-num">0</strong> / <span id="page-count">0</span></span>
        <button class="btn" id="next-page">Selanjutnya ➡</button>
    </div>

    <div class="canvas-container">
        <canvas id="pdf-render"></canvas>
    </div>

    <script>
        // NAMA FILE PDF (Sesuai dengan screenshot Anda)
        const url = 'Dokumen_SOP.pdf'; 

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null,
            pageNum = 1,
            pageIsRendering = false,
            pageNumIsPending = null;

        const canvas = document.getElementById('pdf-render'),
              ctx = canvas.getContext('2d');

        // Fungsi Render Halaman
        const renderPage = num => {
            pageIsRendering = true;
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: 1.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderCtx = { canvasContext: ctx, viewport: viewport };

                page.render(renderCtx).promise.then(() => {
                    pageIsRendering = false;
                    if (pageNumIsPending !== null) {
                        renderPage(pageNumIsPending);
                        pageNumIsPending = null;
                    }
                });

                // Update teks angka di layar
                document.getElementById('page-num').textContent = num;
            });
        };

        const queueRenderPage = num => {
            if (pageIsRendering) {
                pageNumIsPending = num;
            } else {
                renderPage(num);
            }
        };

        // Fungsi mengambil angka halaman dari URL dengan lebih akurat
        const getPageFromHash = () => {
            const hash = window.location.hash;
            const match = hash.match(/page=(\d+)/);
            if (match) {
                return parseInt(match[1], 10);
            }
            return 1;
        };

        // Navigasi Tombol (Sekarang HANYA mengubah URL, sistem yang akan menangani rendernya)
        const showPrevPage = () => {
            if (pageNum <= 1) return;
            window.location.hash = `page=${pageNum - 1}`; 
        };

        const showNextPage = () => {
            if (pageNum >= pdfDoc.numPages) return;
            window.location.hash = `page=${pageNum + 1}`; 
        };

        // Proses Pemuatan Pertama
        pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
            pdfDoc = pdfDoc_;
            document.getElementById('page-count').textContent = pdfDoc.numPages;

            let targetPage = getPageFromHash();
            if (targetPage > pdfDoc.numPages) targetPage = pdfDoc.numPages;
            if (targetPage < 1) targetPage = 1;
            
            pageNum = targetPage;
            renderPage(pageNum);
        }).catch(err => {
            console.error("Error memuat PDF:", err);
            alert("Gagal memuat PDF.");
        });

        // Event Listeners
        document.getElementById('prev-page').addEventListener('click', showPrevPage);
        document.getElementById('next-page').addEventListener('click', showNextPage);

        // Jika URL berubah (baik diketik manual atau via tombol)
        window.addEventListener('hashchange', () => {
            if (!pdfDoc) return; // Cegah error jika PDF belum selesai dimuat
            
            let newPage = getPageFromHash();
            
            // Validasi batasan halaman
            if (newPage > pdfDoc.numPages) newPage = pdfDoc.numPages;
            if (newPage < 1) newPage = 1;

            // Jika halamannya berbeda, proses perubahan layarnya
            if (newPage !== pageNum) {
                pageNum = newPage;
                queueRenderPage(pageNum);
            }
        });
    </script>
</body>
</html>
