<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP Laboratorium Viewer</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        body {
            margin: 0;
            background-color: #334155; /* Warna latar belakang gelap khas PDF viewer */
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .toolbar {
            background-color: #0f172a;
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #2563eb; }
        .btn:disabled { background-color: #64748b; cursor: not-allowed; }
        
        .canvas-container {
            margin-top: 25px;
            margin-bottom: 25px;
            overflow: auto;
            display: flex;
            justify-content: center;
            width: 100%;
        }
        canvas {
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 95%; /* Agar responsif di layar kecil */
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn" id="prev-page">⬅ Sebelumnya</button>
        <span style="font-size: 1.1rem;">Halaman: <strong id="page-num">0</strong> / <span id="page-count">0</span></span>
        <button class="btn" id="next-page">Selanjutnya ➡</button>
    </div>

    <div class="canvas-container">
        <canvas id="pdf-render"></canvas>
    </div>

    <script>
        // PENTING: Masukkan nama file PDF yang benar di sini (Pastikan tanpa spasi!)
        const url = 'Dokumen_SOP.pdf'; 

        // Inisialisasi PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null,
            pageNum = 1,
            pageIsRendering = false,
            pageNumIsPending = null;

        const canvas = document.getElementById('pdf-render'),
              ctx = canvas.getContext('2d');

        // Fungsi Inti: Merender PDF ke dalam Canvas HTML
        const renderPage = num => {
            pageIsRendering = true;

            pdfDoc.getPage(num).then(page => {
                // Skala 1.5 agar tulisan dokumen jernih dan tidak pecah
                const viewport = page.getViewport({ scale: 1.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderCtx = { canvasContext: ctx, viewport: viewport };

                page.render(renderCtx).promise.then(() => {
                    pageIsRendering = false;
                    if (pageNumIsPending !== null) {
                        renderPage(pageNumIsPending);
                        pageNumIsPending = null;
                    }
                });

                // Update angka halaman di panel atas
                document.getElementById('page-num').textContent = num;
            });
        };

        const queueRenderPage = num => {
            if (pageIsRendering) {
                pageNumIsPending = num;
            } else {
                renderPage(num);
            }
        };

        // Membaca target halaman dari URL website Anda (#page=8)
        const getPageFromHash = () => {
            const hash = window.location.hash;
            if (hash.includes('page=')) {
                const num = parseInt(hash.replace('#page=', ''));
                return isNaN(num) ? 1 : num;
            }
            return 1;
        };

        // Fungsi Tombol Navigasi
        const showPrevPage = () => {
            if (pageNum <= 1) return;
            pageNum--;
            window.location.hash = `page=${pageNum}`; // Update URL otomatis
        };

        const showNextPage = () => {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            window.location.hash = `page=${pageNum}`; // Update URL otomatis
        };

        // Proses Pemuatan Dokumen Pertama Kali
        pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
            pdfDoc = pdfDoc_;
            document.getElementById('page-count').textContent = pdfDoc.numPages;

            // Baca URL, cek apakah ada perintah #page=
            let targetPage = getPageFromHash();
            
            // Validasi agar tidak error jika user memasukkan angka sembarangan
            if (targetPage > pdfDoc.numPages) targetPage = pdfDoc.numPages;
            if (targetPage < 1) targetPage = 1;
            
            pageNum = targetPage;
            renderPage(pageNum);
        }).catch(err => {
            console.error("Error memuat PDF:", err);
            alert("Gagal memuat PDF. Pastikan nama file di dalam kode Javascript sudah sesuai dengan file aslinya.");
        });

        // Event Listener untuk tombol
        document.getElementById('prev-page').addEventListener('click', showPrevPage);
        document.getElementById('next-page').addEventListener('click', showNextPage);

        // Bereaksi jika Anda mengubah #page=8 secara manual di Address Bar
        window.addEventListener('hashchange', () => {
            const newPage = getPageFromHash();
            if (newPage !== pageNum && pdfDoc) {
                pageNum = newPage;
                
                // Cegah melebihi batas halaman
                if(pageNum > pdfDoc.numPages) pageNum = pdfDoc.numPages;
                if(pageNum < 1) pageNum = 1;
                
                queueRenderPage(pageNum);
            }
        });
    </script>
</body>
</html>
